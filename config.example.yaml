# slack-notice example config: every key with its built-in default.
# Location: ~/.config/slack-notice/config.yaml (XDG_CONFIG_HOME is honoured when it is an absolute path),
# plus config.d/*.yaml in lexical order; --config <path> reads another file (drop-ins are read next to it).
# Drop-ins: maps merge. Files are parsed with yaml.safe_load and must be at most 64 KiB.
# Precedence: flags, then config, then defaults. There are no environment overrides.
# Durations: a number of seconds, or a string such as "500ms", "10s" or "1m" (no unit means seconds);
# zero is refused. The tool enforces each key's range at load (exit 2 config_invalid, details.key).
# Schema: schemas/config.json. Invalid config exits 2 (config_invalid), naming the key.

# false makes send exit 22 (nothing sent) before any input or the credential is read.
enabled: true

# Name of the environment variable that holds the workflow trigger URL. The URL is a secret and is
# never written here; put it in a mode-0600 env file that your shell or cron line sources.
webhook_env: SLACK_WEBHOOK

# Name of the one text variable your Slack workflow declares.
body_variable: body

# One-line prefix for each level, 1 to 16 characters each; the sanitizer must leave it unchanged.
level_prefix:
  info: "🔵 INFO"
  warn: "🟠 WARN"
  action: "🟡 ACTION"
  error: "🔴 ERROR"

# Body limit in characters (2000 to 12000). A fixed 12000-byte cap also applies.
# A longer message is cut and ends with "…[truncated]".
max_chars: 3000

# The one deadline of a send, covering input, waiting for the send lock, the request and retries (3s to 120s).
timeout: 10s

# false writes no log.jsonl (in the state directory, ~/.local/state/slack-notice by default).
# Dry runs, exit 1, exit 2 and exit 22 are never logged.
log: true
